<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
  <title>GossamerDB v1.0 — mTLS / PKI Flow</title>
  <desc>Three pki.Source implementations (disk, k8s-secret, gossamerctl dev-pki) feed a SAN identity scheme that embeds the cluster name. Hot-reload contract applies new certs at the next handshake without dropping in-flight TLS sessions. Per-handshake validation: cert chain → SAN match → role check. Built-in CA permanently rejected; SPIFFE/Vault deferred to v1.x.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e67e22"/>
    </marker>
  </defs>

  <text x="640" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#222">GossamerDB — mTLS / PKI Flow (§6.7.1)</text>
  <text x="640" y="46" text-anchor="middle" font-size="11" fill="#666">mTLS-only listeners · pki.Source interface · cluster name embedded in SAN · hot-reload zero-downtime · built-in CA permanently rejected (FR-6, Q8).</text>

  <!-- Row 1: pki.Source implementations -->
  <rect x="40" y="70" width="1200" height="170" rx="10" ry="10" fill="#fef9e7" fill-opacity="0.55" stroke="#c9a227" stroke-width="1.5"/>
  <text x="56" y="92" font-size="12" font-weight="600" fill="#7d6608">pki.Source interface — v1 implementations (FR-6)</text>

  <g>
    <rect x="60" y="110" width="370" height="115" rx="8" ry="8" fill="#fffbe6" stroke="#c9a227" stroke-width="1.5"/>
    <text x="245" y="132" text-anchor="middle" font-weight="700">disk source</text>
    <text x="245" y="152" text-anchor="middle" font-size="10.5" fill="#5e4b00">cert / key / CA-bundle paths in cluster YAML</text>
    <text x="245" y="170" text-anchor="middle" font-size="10.5" fill="#5e4b00">fsnotify watches for file changes</text>
    <text x="245" y="188" text-anchor="middle" font-size="10.5" fill="#5e4b00">operator owns rotation cadence</text>
    <text x="245" y="208" text-anchor="middle" font-size="10" fill="#7d6608">ships in v1.0 · default for VM deployments</text>
  </g>

  <g>
    <rect x="455" y="110" width="370" height="115" rx="8" ry="8" fill="#fffbe6" stroke="#c9a227" stroke-width="1.5"/>
    <text x="640" y="132" text-anchor="middle" font-weight="700">k8s-secret source</text>
    <text x="640" y="152" text-anchor="middle" font-size="10.5" fill="#5e4b00">references k8s Secret by name</text>
    <text x="640" y="170" text-anchor="middle" font-size="10.5" fill="#5e4b00">watches Secret API server-side</text>
    <text x="640" y="188" text-anchor="middle" font-size="10.5" fill="#5e4b00">cert-manager integrates "for free"</text>
    <text x="640" y="208" text-anchor="middle" font-size="10" fill="#7d6608">ships in v1.0 · default for k8s deployments</text>
  </g>

  <g>
    <rect x="850" y="110" width="370" height="115" rx="8" ry="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
    <text x="1035" y="132" text-anchor="middle" font-weight="700">gossamerctl dev-pki</text>
    <text x="1035" y="152" text-anchor="middle" font-size="10.5" fill="#7d3c00">one-shot localhost CA + node/admin/client certs</text>
    <text x="1035" y="170" text-anchor="middle" font-size="10.5" fill="#7d3c00">local-mode ONLY · refuses non-local hostnames</text>
    <text x="1035" y="188" text-anchor="middle" font-size="10.5" fill="#7d3c00">closes the dev-friction gap (R6)</text>
    <text x="1035" y="208" text-anchor="middle" font-size="10" fill="#a85a16">never use in production</text>
  </g>

  <!-- Arrows down to SAN scheme -->
  <line x1="245" y1="225" x2="245" y2="262" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="225" x2="640" y2="262" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1035" y1="225" x2="1035" y2="262" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Row 2: SAN scheme -->
  <rect x="40" y="265" width="1200" height="125" rx="10" ry="10" fill="#e8f0f8" fill-opacity="0.45" stroke="#4a6a9c" stroke-width="1.5"/>
  <text x="56" y="287" font-size="12" font-weight="600" fill="#1f3a68">SAN identity scheme — cluster name embedded · prevents cross-cluster cert reuse</text>

  <g>
    <rect x="60" y="305" width="280" height="65" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="200" y="325" text-anchor="middle" font-weight="600">coordinator.&lt;cluster&gt;</text>
    <text x="200" y="343" text-anchor="middle" font-size="10" fill="#1f3a68">control plane, Raft peers</text>
    <text x="200" y="357" text-anchor="middle" font-size="10" fill="#1f3a68">admin API access</text>
  </g>
  <g>
    <rect x="360" y="305" width="280" height="65" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="500" y="325" text-anchor="middle" font-weight="600">data.&lt;cluster&gt;.&lt;region&gt;</text>
    <text x="500" y="343" text-anchor="middle" font-size="10" fill="#1f3a68">data-plane peers, gossip</text>
    <text x="500" y="357" text-anchor="middle" font-size="10" fill="#1f3a68">replication, anti-entropy</text>
  </g>
  <g>
    <rect x="660" y="305" width="280" height="65" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="800" y="325" text-anchor="middle" font-weight="600">admin.&lt;cluster&gt;</text>
    <text x="800" y="343" text-anchor="middle" font-size="10" fill="#1f3a68">human/CLI admin actor</text>
    <text x="800" y="357" text-anchor="middle" font-size="10" fill="#1f3a68">rolling-upgrade orchestration</text>
  </g>
  <g>
    <rect x="960" y="305" width="260" height="65" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="1090" y="325" text-anchor="middle" font-weight="600">client.&lt;cluster&gt;</text>
    <text x="1090" y="343" text-anchor="middle" font-size="10" fill="#1f3a68">application caller</text>
    <text x="1090" y="357" text-anchor="middle" font-size="10" fill="#1f3a68">KV API access</text>
  </g>

  <line x1="500" y1="390" x2="500" y2="425" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="800" y1="390" x2="800" y2="425" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Row 3: Hot reload (left) + Validation (right) -->
  <rect x="40" y="430" width="600" height="220" rx="10" ry="10" fill="#eaf2ff" fill-opacity="0.45" stroke="#2980b9" stroke-width="1.5"/>
  <text x="56" y="452" font-size="12" font-weight="600" fill="#1f3a68">Hot-reload contract (zero downtime)</text>
  <g>
    <rect x="60" y="470" width="270" height="55" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="195" y="490" text-anchor="middle" font-weight="600">New cert detected</text>
    <text x="195" y="508" text-anchor="middle" font-size="10" fill="#1f3a68">fsnotify or k8s watch</text>
  </g>
  <g>
    <rect x="350" y="470" width="270" height="55" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="485" y="490" text-anchor="middle" font-weight="600">Reload TLS config</text>
    <text x="485" y="508" text-anchor="middle" font-size="10" fill="#1f3a68">applied at NEXT handshake</text>
  </g>
  <g>
    <rect x="60" y="540" width="270" height="55" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="195" y="560" text-anchor="middle" font-weight="600">In-flight TLS sessions</text>
    <text x="195" y="578" text-anchor="middle" font-size="10" fill="#1f3a68">keep old creds until they close</text>
  </g>
  <g>
    <rect x="350" y="540" width="270" height="55" rx="8" ry="8" fill="#eaf2ff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="485" y="560" text-anchor="middle" font-weight="600">Cert reload event</text>
    <text x="485" y="578" text-anchor="middle" font-size="10" fill="#1f3a68">audit log: NotBefore / NotAfter / SANs</text>
  </g>
  <line x1="330" y1="497" x2="350" y2="497" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="195" y1="525" x2="195" y2="540" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="485" y1="525" x2="485" y2="540" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="340" y="615" font-size="10.5" fill="#1f3a68">→ Observability: mtls_cert_expires_in_seconds Prometheus metric · Grafana panel + sample alert (deploy/observability/)</text>

  <rect x="660" y="430" width="580" height="220" rx="10" ry="10" fill="#e8f4e8" fill-opacity="0.45" stroke="#4a7c4a" stroke-width="1.5"/>
  <text x="676" y="452" font-size="12" font-weight="600" fill="#1e6b3a">Per-handshake validation (rejected on first failure)</text>

  <g>
    <rect x="680" y="470" width="540" height="55" rx="8" ry="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
    <text x="950" y="490" text-anchor="middle" font-weight="700">1. Mutual cert validation</text>
    <text x="950" y="508" text-anchor="middle" font-size="10" fill="#1e6b3a">peer cert chain verified against trust bundle (CA + intermediates)</text>
  </g>
  <g>
    <rect x="680" y="535" width="540" height="55" rx="8" ry="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
    <text x="950" y="555" text-anchor="middle" font-weight="700">2. SAN match check</text>
    <text x="950" y="573" text-anchor="middle" font-size="10" fill="#1e6b3a">cluster name in SAN must match cluster config · cross-cluster cert reuse rejected</text>
  </g>
  <g>
    <rect x="680" y="600" width="540" height="40" rx="8" ry="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
    <text x="950" y="618" text-anchor="middle" font-weight="700">3. Role check</text>
    <text x="950" y="634" text-anchor="middle" font-size="10" fill="#1e6b3a">admin.&lt;cluster&gt; → admin API · data.&lt;cluster&gt;.* → data plane · client.&lt;cluster&gt; → KV API</text>
  </g>
  <line x1="950" y1="525" x2="950" y2="535" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="590" x2="950" y2="600" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Footer panel: rejected/deferred -->
  <rect x="40" y="675" width="1200" height="110" rx="8" ry="8" fill="#fafafa" stroke="#ccc"/>
  <text x="60" y="697" font-size="12" font-weight="600" fill="#333">Boundary decisions</text>
  <text x="60" y="717" font-size="11" fill="#444"><tspan font-weight="600" fill="#a93226">Permanently rejected:</tspan> built-in CA. GossamerDB will not generate or rotate root certs in production. Operators bring their own PKI (FR-6, Q8).</text>
  <text x="60" y="735" font-size="11" fill="#444"><tspan font-weight="600" fill="#a85a16">Deferred to v1.x (FC-6):</tspan> SPIFFE/SPIRE source · HashiCorp Vault source · both as additional pki.Source implementations behind the same interface.</text>
  <text x="60" y="753" font-size="11" fill="#444"><tspan font-weight="600" fill="#1e6b3a">v1.0 ships with:</tspan> disk source, k8s-secret source, gossamerctl dev-pki (local-only). All three implement the same hot-reload + audit-log contract.</text>
  <text x="60" y="771" font-size="11" fill="#444"><tspan font-weight="600">No --insecure flag (R6):</tspan> mTLS is mandatory on all listeners. Local dev pain is closed by gossamerctl dev-pki, not by an opt-out.</text>
</svg>
