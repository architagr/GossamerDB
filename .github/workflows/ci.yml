# GitHub Actions CI workflow for GossamerDB
name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Lint, Test, and Bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run golangci-lint (root module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Run Unit Tests (root module)
        run: go test -v -race ./...

      - name: Run Performance Bench Gate
        # Enforces NFR-PERF-1 < 1 ms p99 SLO; no-ops gracefully when no benchmarks exist yet
        run: |
          chmod +x ./scripts/bench-check.sh
          ./scripts/bench-check.sh

      - name: Build (root module)
        run: go build ./...

  infra-build-and-test:
    name: Infra Lint, Test, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: infra/go.sum

      - name: Run golangci-lint (infra module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          working-directory: infra

      - name: Run Unit Tests (infra module)
        run: go test -v -race ./...

      - name: Build (infra module)
        run: go build ./...
